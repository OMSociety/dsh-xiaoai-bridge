# 小爱模式：音箱那一路的 Agent 预设。
#
# 这一份 bundle 只做一件事：向 profile 的 Loader 组合里插入一行
# `@deepseek-ai/dsh-agent-preset` 声明（id: preset-xiaoai），于是设置页的
# 「Agent 预设」里就多出一个可选的「小爱模式」。
#
# 组合清单以「标准模式」为底、减掉一部分：保留人格、说明文件、文件读写与检索、
# 技能、联网查资料、上下文压缩、终端（bash/pwsh）与后台任务、待办清单；去掉
# 子代理与工作流、计划模式、问询卡片 —— 音箱会话是「说出来」的，子代理和计划
# 模式要人盯着看，ask_user_question 那种等界面点选的工具会让语音这一轮卡住。
#
# 终端与后台任务、待办在清单里（见 docs/deploy.md §12.36.8）：音箱会话要能查
# 本机进程、跑命令。这里只声明**工具那一行**——沙箱 seam、沙箱策略、审批与 shell
# 环境变量都在宿主侧（与 standard 一致），所以策略跟着会话的权限预设走，不在这份
# 文件里另设一套。
#
# 用法：在 DSH 里用 plugin_manager 的 install_bundle、target 指向本目录。
# 细节见仓库 README 的「小爱模式」一节与 docs/deploy.md。
- insert:
    - id: preset-xiaoai
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xiaoai
        name: 小爱模式
        description: 音箱会话专用：会说话，能读写文件、查资料、跑终端命令、记待办，没有子代理与计划模式。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the assistant behind a Xiaomi Xiaoai smart speaker. The speaker reads everything you write aloud, so answer in short spoken sentences. Never use tables, fenced code blocks, or long lists, and never use emoji. Lead with the headline, then offer to say more. Speak Chinese unless the person speaks another language.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
