# Linux host networking lets the bridge reach the host callback on loopback.
services:
  open-xiaoai-bridge:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      LOGLEVEL: INFO
      API_SERVER_ENABLE: "1"
      API_SERVER_HOST: "127.0.0.1"
      DSH_ENABLE: "${DSH_ENABLE:-0}"
      XIAOAI_API_TOKEN: "${XIAOAI_API_TOKEN:-}"
    volumes:
      - ./config.py:/app/config.py:ro
      - ./models:/app/core/models
